services:
  app:
    container_name: griffin-test
    build: .
    restart: always
    ports:
      - "20020:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: ./.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./data/griffin.db
