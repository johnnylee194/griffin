name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm install && cd backend && npm install
    - name: Run Backend Tests
      run: cd backend && npx vitest run src/tests

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm install && cd frontend && npm install
    - name: Run Frontend Tests
      run: cd frontend && npx vitest run src/tests

  e2e-playwright:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    - name: Install dependencies
      run: |
        npm install
        cd backend && npm install
        cd ../frontend && npm install
        cd ../e2e && npm install
    - name: Install Playwright Browsers
      run: cd e2e && npx playwright install --with-deps
    - name: Run Playwright tests
      run: cd e2e && npx playwright test tests/main.spec.ts
    - name: Upload Playwright Trace and Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-results
        path: e2e/test-results/
        retention-days: 7
